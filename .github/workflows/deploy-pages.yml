name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate deploy config
        run: |
          if [ -z "${PUBLIC_API_ORIGIN}" ]; then
            echo "PUBLIC_API_ORIGIN is required. Add it in GitHub repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${PUBLIC_SITE_URL}" ]; then
            echo "PUBLIC_SITE_URL is required. Add it in GitHub repo Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          PUBLIC_API_ORIGIN: ${{ vars.PUBLIC_API_ORIGIN || secrets.PUBLIC_API_ORIGIN }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || secrets.PUBLIC_SITE_URL }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_API_ORIGIN: ${{ vars.PUBLIC_API_ORIGIN || secrets.PUBLIC_API_ORIGIN }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || secrets.PUBLIC_SITE_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
